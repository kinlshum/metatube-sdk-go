---
- name: Deploy the Emby-only MetaTube2 service
  hosts: metatube2_hosts
  gather_facts: false
  serial: 1
  any_errors_fatal: true

  tasks:
    - name: Run the fixed MetaTube2 deployment wrapper
      ansible.builtin.command:
        argv:
          - sudo
          - -n
          - /usr/local/sbin/deploy-metatube2
      register: metatube2_deploy
      changed_when: true

    - name: Show deployment verification and rollback details
      ansible.builtin.debug:
        var: metatube2_deploy.stdout_lines

